name: APT repository tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 Scripts/audit-public.py
      - run: python3 Scripts/test-apt-repository.py
      - run: python3 Scripts/test-assemble-pages.py
